name: Publicar painel no GitHub Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Bloquear dados sem criptografia
        run: |
          ruim=$(git ls-files | grep -Ei '\.(csv|pdf|xlsx?|xlsm)$|^dados/|^entrada/|senha' || true)
          extra=$(ls site/data/*.json 2>/dev/null | grep -v -E 'site/data/(painel\.enc|versao)\.json$' || true)
          if [ -n "$ruim$extra" ]; then echo "Arquivos que não podem ser publicados:"; echo "$ruim $extra"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
